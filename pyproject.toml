[project]
name = "zarrmony"
dynamic = ["version"]
description = "Convert any bioimage file to OME-Zarr v0.5, preserving metadata."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Max Ferrin", email = "ferrin@calicolabs.com" }]
dependencies = [
    "bioio>=3.3.0",
    "bioio-czi>=2.6.1",
    "bioio-lif>=1.4.2",
    "bioio-nd2>=1.7.0",
    "bioio-ome-zarr>=3.3.0",
    "click>=8.3.0",
    "dask>=2026.3.0",
    "numpy>=2",
    "ome-types>=0.6.3",
    "scikit-image>=0.26.0",
    "xarray>=2025.9.0",
    # zarr pinned <3.2 because tifffile's tifffile.zarr module imports
    # RegularChunkGrid from zarr.core.chunk_grids — an internal path that was
    # removed in zarr 3.2.0. bioio-ome-tiff uses tifffile.aszarr() to read TIFF
    # data lazily, so anyone reading OME-TIFF input through zarrmony hits this.
    # Relax once upstream tifffile updates its zarr 3.2+ shims.
    "zarr>=3.1,<3.2",
]

[project.optional-dependencies]
gcs = ["gcsfs"]
s3 = ["s3fs"]
ome-tiff = ["bioio-ome-tiff"]
validate = ["ome-zarr-models>=1.0"]
all = ["zarrmony[gcs,s3,ome-tiff,validate]"]
dev = [
    "black~=25.12.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
    "pre-commit>=4",
    "bioio-ome-tiff",
    "ome-zarr-models>=1.0",
]
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=6",
    "matplotlib>=3.9",
    "tabulate>=0.9",
]

[project.scripts]
zarrmony = "zarrmony.cli:app"

[project.urls]
Homepage = "https://github.com/ferrinm/zarrmony"
Issues = "https://github.com/ferrinm/zarrmony/issues"
Changelog = "https://github.com/ferrinm/zarrmony/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=80", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
