[project]
name = "zarrmony"
dynamic = ["version"]
description = "Convert any bioimage file to OME-Zarr v0.5, preserving metadata."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Max Ferrin", email = "ferrin@calicolabs.com" }]
dependencies = [
    "bioio>=3.3.0",
    # Transitive via bioio, but declared because readers/default.py imports
    # UnsupportedFileFormatError from it directly — bioio does not re-export it.
    "bioio-base>=3.3.0",
    # bioio-czi hard-depends on aicspylibczi, which zarrmony never calls — the
    # CZI plugin uses the default pylibczirw backend, and only bioio_czi's own
    # module-scope import pulls aicspylibczi in. aicspylibczi publishes exactly
    # one Linux wheel family, manylinux x86_64, so every other Linux machine
    # source-builds it and needs cmake. Excluded by marker on those machines;
    # the `czi` extra opts back in. The marker names the one Linux arch that
    # works rather than the arches that do not, so a Graviton host, an armv7
    # board and an s390x LPAR are all covered without listing them.
    "bioio-czi>=2.6.1; sys_platform != 'linux' or platform_machine == 'x86_64'",
    "bioio-lif>=1.4.2",
    "bioio-nd2>=1.7.0",
    "bioio-ome-zarr>=3.3.0",
    "click>=8.3.0",
    "dask>=2026.3.0",
    "numpy>=2",
    "ome-types>=0.6.3",
    "scikit-image>=0.26.0",
    "xarray>=2025.9.0",
    # zarr pinned <3.2 because tifffile's tifffile.zarr module imports
    # RegularChunkGrid from zarr.core.chunk_grids — an internal path that was
    # removed in zarr 3.2.0. bioio-ome-tiff uses tifffile.aszarr() to read TIFF
    # data lazily, so anyone reading OME-TIFF input through zarrmony hits this.
    # Relax once upstream tifffile updates its zarr 3.2+ shims.
    "zarr>=3.1,<3.2",
]

[project.optional-dependencies]
gcs = ["gcsfs"]
s3 = ["s3fs"]
ome-tiff = ["bioio-ome-tiff"]
validate = ["ome-zarr-models>=1.0"]
# CZI is a core dependency on every platform the marker above covers. This
# extra restores it on the Linux arches it excludes, where installing it means
# a C++ source build the user is choosing on purpose. It is a no-op elsewhere.
# Unlike `bioformats`, it carries no licensing constraint, so it is in `all` —
# which is why `all` also needs cmake on those arches.
czi = ["bioio-czi>=2.6.1"]
# Bio-Formats-backed vendor formats (Olympus cellSens VSI, Zeiss ZVI,
# Hamamatsu NDPI, ...). Deliberately opt-in — see ADR-0011.
bioformats = ["bioio-bioformats>=2"]
# `bioformats` is intentionally NOT in `all`, and must stay out of it:
# bioio-bioformats is GPL-3.0 and zarrmony is Apache-2.0, so it is only ever
# a GPL environment the *user* assembles for themselves (ADR-0011). It is out
# of `dev` for the same reason plus a practical one — CI would resolve a JVM
# toolchain on every run for a backend no in-tree test exercises.
all = ["zarrmony[gcs,s3,ome-tiff,validate,czi]"]
dev = [
    # Black and Ruff are pinned to the same compatible-release ranges the
    # downstream deployment mirror's CI installs, so that a formatter version
    # skew can never show up as a spurious diff between the two repos.
    "black~=26.3.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff~=0.15.10",
    "pre-commit>=4",
    "bioio-ome-tiff",
    "ome-zarr-models>=1.0",
    # bioio-czi is deliberately absent. The core marker above already installs
    # it on every CI runner (x86-64 Linux, both macOS arches), so listing it
    # here would add nothing there. It would only change the one environment
    # the marker exists to protect — an arm64 dev box or self-hosted runner,
    # where it would re-impose the aicspylibczi source build on `uv sync`.
]
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=6",
    "matplotlib>=3.9",
    "tabulate>=0.9",
]

[project.scripts]
zarrmony = "zarrmony.cli:app"

[project.urls]
Homepage = "https://github.com/ferrinm/zarrmony"
Issues = "https://github.com/ferrinm/zarrmony/issues"
Changelog = "https://github.com/ferrinm/zarrmony/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=80", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.black]
# Black's output can vary with the target version it infers, and it infers that
# from the interpreter it runs under. Fixing it here keeps formatting identical
# no matter which Python invokes black — ours runs 3.13, the downstream
# deployment mirror's runs 3.14, and an unpinned target makes them disagree.
target-version = ["py311"]
# Black's default, stated because ruff's line-length below is 100 and reading
# that as the formatter's width is the mistake this line exists to prevent.
line-length = 88

[tool.ruff]
# Lint-only. The formatter is black, at the width above; never `ruff format`.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
