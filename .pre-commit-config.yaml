repos:
  # Keep these three revisions in step with the dev extra in pyproject.toml and
  # with prettier in package.json. All of them track the versions the downstream
  # deployment mirror's CI installs.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.2
    hooks:
      - id: prettier
  - repo: local
    hooks:
      - id: no-internal-paths
        name: no internal dataset paths or identifiers
        entry: python scripts/check_no_internal_paths.py
        language: system
        pass_filenames: true
        # The checker, its tests and the convention doc all name the patterns
        # they exist to catch, so they would flag themselves. The test file's
        # fixtures are synthetic placeholders, not redacted real names.
        exclude: ^(scripts/check_no_internal_paths\.py|tests/test_check_no_internal_paths\.py|CONTRIBUTING\.md)$
