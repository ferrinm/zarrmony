repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0
    hooks:
      - id: black
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.2.4
    hooks:
      - id: prettier
  - repo: local
    hooks:
      - id: no-internal-paths
        name: no internal dataset paths or identifiers
        entry: python scripts/check_no_internal_paths.py
        language: system
        pass_filenames: true
        # The checker and the convention doc both name the patterns they
        # exist to catch, so they would flag themselves.
        exclude: ^(scripts/check_no_internal_paths\.py|CONTRIBUTING\.md)$
